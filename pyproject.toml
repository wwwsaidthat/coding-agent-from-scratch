[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent-from-scratch"
version = "0.4.0"
description = "A lightweight coding agent built from scratch with local file and command tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "wwwsaidthat" }]
dependencies = []

[project.scripts]
coding-agent = "coding_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coding_agent = ["web/*.html", "web/*.css", "web/*.js"]
